<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twilog CSV Analytics Toolkit</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    {% block head_extras %}{% endblock %}
</head>
<body>
    <header class="app-header">
        <div class="header-main">
            <div class="brand">Twilog CSV Analytics Toolkit</div>
            <div class="subtitle">CSVをアップロードして投稿を可視化</div>
        </div>
        <div class="header-actions">
            <a class="btn-secondary" href="https://github.com/TweeTeaFOX223/twilog-csv-analytics-toolkit" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a class="btn-secondary" href="/licenses">ライセンス</a>
            {% block header_actions %}{% endblock %}
        </div>
    </header>
    <main class="app-main">
        {% block content %}{% endblock %}
    </main>
    <script>
    function purgePlotly(root=document) {
      if (!window.Plotly || !root) return;
      const targets = root.querySelectorAll('[data-plot-json]');
      targets.forEach((el) => {
        try {
          Plotly.purge(el);
        } catch (e) {
          // ignore purge errors on non-initialized nodes
        }
      });
    }

    function renderPlotly(root=document) {
      const targets = root.querySelectorAll('[data-plot-json]');
      targets.forEach((el) => {
        const specText = el.getAttribute('data-plot-json');
        if (!specText) return;
        try {
          const spec = JSON.parse(specText);
          el.innerHTML = '';
          Plotly.newPlot(
            el,
            spec.data || [],
            spec.layout || {},
            { responsive: true, displaylogo: false }
          ).then(() => {
            requestAnimationFrame(() => {
              try {
                Plotly.Plots.resize(el);
              } catch (_) {}
            });
          });
        } catch (e) {
          console.error('plot render error', e);
        }
      });
    }
    document.addEventListener('DOMContentLoaded', () => renderPlotly(document));
    document.body.addEventListener('htmx:beforeSwap', (e) => {
      const target = (e.detail && e.detail.target) ? e.detail.target : e.target;
      if (target) purgePlotly(target);
    });
    document.body.addEventListener('htmx:afterSettle', () => {
      // For outerHTML swaps, event target may point to the old detached node.
      // Re-scan the current document to render newly inserted plots reliably.
      renderPlotly(document);
    });
    window.addEventListener('resize', () => {
      if (!window.Plotly) return;
      document.querySelectorAll('[data-plot-json]').forEach((el) => {
        try {
          Plotly.Plots.resize(el);
        } catch (_) {}
      });
    });
    </script>
</body>
</html>
